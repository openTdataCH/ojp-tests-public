http:
  method: POST
  url: "{{server}}"
  body:
    type: xml
    data: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <OJP xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns=\"http://www.siri.org.uk/siri\" version=\"1.0\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>LIR-1c</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <GeoPosition>\r

      \                        <Longitude>8.55330</Longitude>\r

      \                        <Latitude>47.37609</Latitude>\r

      \                    </GeoPosition>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>stop</ojp:Type>\r

      \                    <ojp:NumberOfResults>10</ojp:NumberOfResults>\r

      \                    <ojp:IncludePtModes>true</ojp:IncludePtModes>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Contains first 4 Stop Texts\", function() {\r

        \    expect(res.getBody()?.toString()).to.include(\"Zürich, Platte\");\r

        \    expect(res.getBody()?.toString()).to.include(\"Zürich, Voltastrasse\");\r

        \    expect(res.getBody()?.toString()).to.include(\"Zürich, Kantonsschule\");\r

        \    expect(res.getBody()?.toString()).to.include(\"Zürich, ETH/Universitätsspital\");\r

        });\r

        \r

        test(\"correct coordinates\", function() {\r

        \    expect(res.getBody()?.toString()).to.include(\"<siri:Longitude>8.552\");\r

        \    expect(res.getBody()?.toString()).to.include(\"<siri:Latitude>47.375\");\r

        \    expect(res.getBody()?.toString()).to.include(\"<siri:Longitude>8.552\");\r

        \    expect(res.getBody()?.toString()).to.include(\"<siri:Latitude>47.374\");\r

        });\r

        \r

        test(\"Response contains specific StopPlaceRefs (DIDOK or SLOID)\", function () {\r

        \    const responseText = res.getBody()?.toString();\r

        \    const stops = [\r

        \        { didok: \"8591303\", sloid: \"ch:1:sloid:91303\" },\r

        \        { didok: \"8591412\", sloid: \"ch:1:sloid:91412\" },\r

        \        { didok: \"8591220\", sloid: \"ch:1:sloid:91220\" },\r

        \        { didok: \"8591123\", sloid: \"ch:1:sloid:91123\" }\r

        \    ];\r

        \    stops.forEach(({ didok, sloid }) => {\r

        \        const found = responseText.includes(didok) || responseText.includes(sloid);\r

        \        if (!found) console.log(`MISSING: ${didok} / ${sloid}`);\r

        \        expect(found, `StopPlaceRef fehlt: ${didok} oder ${sloid}`).to.be.true;\r

        \    });\r

        });"

