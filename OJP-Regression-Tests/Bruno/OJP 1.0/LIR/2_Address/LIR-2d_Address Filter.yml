info:
  name: LIR-2d_Address Filter
  type: http
  seq: 6

http:
  method: POST
  url: "{{server}}"
  body:
    type: xml
    data: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <OJP xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns=\"http://www.siri.org.uk/siri\" version=\"1.0\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>LIR-2a</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <ojp:LocationName>Schulstrasse</ojp:LocationName>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>address</ojp:Type>\r

      \                    <ojp:NumberOfResults>10</ojp:NumberOfResults>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Body contains <Address>\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(\"Address>\");\r

        });\r

        \r

        test(\"Body contains not <StopPlace>\", function () {\r

        \    expect(res.getBody()?.toString()).to.not.include(\"StopPlace>\");\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

