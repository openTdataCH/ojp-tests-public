info:
  name: LIR-2e_Address_Circle
  type: http
  seq: 5

http:
  method: POST
  url: "{{server}}"
  body:
    type: xml
    data: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <OJP xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns=\"http://www.siri.org.uk/siri\" version=\"1.0\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>LIR-2c</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <ojp:GeoRestriction>\r

      \                        <ojp:Circle>\r

      \                            <ojp:Center>\r

      \                                <siri:Longitude>7.416356</siri:Longitude>\r

      \                                <siri:Latitude>46.926923</siri:Latitude>\r

      \                            </ojp:Center>\r

      \                            <ojp:Radius>200</Radius>\r

      \                        </ojp:Circle>\r

      \                    </ojp:GeoRestriction>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>address</ojp:Type>\r

      \                    <ojp:NumberOfResults>1000</ojp:NumberOfResults>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Response contains Könizstrasse\", function() {\r

        \    expect(res.getBody()?.toString()).to.include(\"Könizstrasse\");\r

        });\r

        \r

        test(\"Response contains Flurweg\", function() {\r

        \    expect(res.getBody()?.toString()).to.not.include(\"Flurweg\");\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

