    data: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <OJP xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns=\"http://www.siri.org.uk/siri\" version=\"1.0\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>LIR-2b</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <ojp:GeoPosition>\r

      \                        <Longitude>8.52062</Longitude>\r

      \                        <Latitude>47.36085</Latitude>\r

      \                    </ojp:GeoPosition>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>address</ojp:Type>\r

      \                    <ojp:NumberOfResults>10</ojp:NumberOfResults>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Response contains Text Staffelstrasse 12 (Zürich)\", function() {\r

        \    expect(res.getBody()?.toString()).to.include(\"Staffelstrasse 12 (Zürich)\");\r

        });\r

        \r

        test(\"Response contains correct GeoPosition\", function() {\r

        \    expect(res.getBody()?.toString()).to.include(\"8.52063\");\r

        \    expect(res.getBody()?.toString()).to.include(\"47.36084\");\r

        });"

