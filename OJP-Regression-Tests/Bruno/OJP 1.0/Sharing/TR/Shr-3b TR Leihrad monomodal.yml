      \                    </ojp:Extension>\r

      \                </ojp:Params>\r

      \            </ojp:OJPTripRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>\r\n"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"IndividualMode: genau 1x 'cycle', genau 2x 'walk'\", function () {\r

        \    const responseText = res.getBody()?.toString();\r

        \r

        \    function countOccurrences(text, searchStr) {\r

        \        let count = 0;\r

        \        let pos = 0;\r

        \        while ((pos = text.indexOf(searchStr, pos)) !== -1) {\r

        \            count++;\r

        \            pos += searchStr.length;\r

        \        }\r

        \        return count;\r

        \    }\r

        \r

        \    const cycleCount = countOccurrences(responseText, '<ojp:IndividualMode>cycle</ojp:IndividualMode>');\r

        \    const walkCount  = countOccurrences(responseText, '<ojp:IndividualMode>walk</ojp:IndividualMode>');\r

        \r

        \    expect(cycleCount, `IndividualMode 'cycle' erwartet mind. 1x, gefunden ${cycleCount}x`).to.least(1);\r

        \    expect(walkCount,  `IndividualMode 'walk' erwartet mind. 2x, gefunden ${walkCount}x`).to.least(2);\r

        });"

