http:
  method: POST
  url: "{{server}}"
  body:
    type: xml
    data: "<OJP xmlns=\"http://www.siri.org.uk/siri\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\" version=\"1.0\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>Shr-3a</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <ojp:GeoRestriction>\r

      \                        <ojp:Rectangle>\r

      \                            <ojp:UpperLeft>\r

      \                                <Longitude>7.431108</Longitude>\r

      \                                <Latitude>46.951012</Latitude>\r

      \                            </ojp:UpperLeft>\r

      \                            <ojp:LowerRight>\r

      \                                <Longitude>7.452938</Longitude>\r

      \                                <Latitude>46.94140</Latitude>\r

      \                            </ojp:LowerRight>\r

      \                        </ojp:Rectangle>\r

      \                    </ojp:GeoRestriction>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>poi</ojp:Type>\r

      \                    <ojp:PointOfInterestFilter>\r

      \                        <ojp:PointOfInterestCategory>\r

      \                            <ojp:OsmTag>\r

      \                                <ojp:Tag>amenity</ojp:Tag>\r

      \                                <ojp:Value>escooter_rental</ojp:Value>\r

      \                            </ojp:OsmTag>\r

      \                        </ojp:PointOfInterestCategory>\r

      \                    </ojp:PointOfInterestFilter>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Enthält escooter\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(\"<ojp:Value>escooter_rental\");\r

        });\r

        \r

        //pm.test(\"Enthält keine POI\", function () {\r

        //    pm.expect(pm.response.text()).to.not.include(\"POI_1\");\r

        //});\r

        \r

        test(\"Check if XML body contains less 100 escooter_rental\", function () {\r

        \    var searchString = \"escooter_rental\";\r

        \    var xmlResponse = res.getBody()?.toString();\r

        \    var occurrences = (xmlResponse.match(new RegExp(searchString, \"g\")) || []).length;\r

        \    expect(occurrences).to.lessThan(100);\r

        });"

