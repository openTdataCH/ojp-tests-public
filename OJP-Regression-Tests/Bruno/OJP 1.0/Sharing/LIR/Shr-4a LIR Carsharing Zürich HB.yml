info:
  name: Shr-4a LIR Carsharing Zürich HB
  type: http
  seq: 6

http:
  method: POST
  url: "{{server}}"
  headers:
    - name: Content-Type
      value: text/xml
  body:
    type: xml
    data: "<OJP xmlns=\"http://www.siri.org.uk/siri\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\" version=\"1.0\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPLocationInformationRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>Shr-4a</MessageIdentifier>\r

      \                <ojp:InitialInput>\r

      \                    <ojp:GeoRestriction>\r

      \                        <ojp:Circle> <!--Anfrag mittels Circle oder Rectangle-->\r

      \                            <ojp:Center> <!--Koordinate, zu welcher Objekte geliefert werden sollen-->\r

      \                                <Longitude>8.53625</Longitude> <!--WGS84 Lon-->\r

      \                                <Latitude>47.37786</Latitude> <!--WGS84 Lat-->\r

      \                            </ojp:Center>\r

      \                            <ojp:Radius>2000</ojp:Radius> <!--Radius in Meter um Koordinate-->\r

      \                        </ojp:Circle>\r

      \                    </ojp:GeoRestriction>\r

      \                </ojp:InitialInput>\r

      \                <ojp:Restrictions>\r

      \                    <ojp:Type>poi</ojp:Type>\r

      \                    <ojp:PointOfInterestFilter>\r

      \                        <ojp:PointOfInterestCategory>\r

      \                            <ojp:OsmTag>\r

      \                                <ojp:Tag>amenity</ojp:Tag>\r

      \                                <ojp:Value>car_sharing</ojp:Value>  <!--CarSharer oder deren Stationen-->\r

      \                            </ojp:OsmTag>\r

      \                        </ojp:PointOfInterestCategory>\r

      \                    </ojp:PointOfInterestFilter>\r

      \                </ojp:Restrictions>\r

      \            </ojp:OJPLocationInformationRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Body matches string car_sharing\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(\"<ojp:Value>car_sharing</ojp:Value>\");\r

        });\r

        test(\"Body matches string num_docks and vehicles available\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(\"ojp:num_vehicles_available\")\r

        \    expect(res.getBody()?.toString()).to.include(\"ojp:num_docks_available\");;\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

