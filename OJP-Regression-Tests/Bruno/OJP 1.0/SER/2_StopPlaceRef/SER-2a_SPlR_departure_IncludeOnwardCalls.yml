      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>IRMA</RequestorRef>\r

      \            <ojp:OJPStopEventRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>SER-2a</MessageIdentifier>\r

      \                <ojp:Location>\r

      \                    <ojp:PlaceRef>\r

      \                        <ojp:StopPlaceRef>ch:1:sloid:30813</ojp:StopPlaceRef>\r

      \                        <ojp:LocationName>\r

      \                            <ojp:Text>Zürich Kreuzplatz</ojp:Text>\r

      \                        </ojp:LocationName>\r

      \                    </ojp:PlaceRef>\r

      \                    <ojp:DepArrTime>{{friday_timetable_change}}T11:00:00Z</ojp:DepArrTime>\r

      \                </ojp:Location>\r

