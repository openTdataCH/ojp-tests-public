      code: "test(\"Body matches string\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(bru.getCollectionVar('friday_timetable_change'));\r

        });\r

        \r

        test(\"Response contains <= 22 of <ojp:ResultId>\", function () {\r

        \    var searchString = \"<ojp:ResultId>\";\r

        \    var responseBody = res.getBody()?.toString();\r

        \    var occurrencesCount = (responseBody.match(new RegExp(searchString, \"g\")) || []).length;\r

        \    expect(occurrencesCount).to.be.at.least(22);\r

        });"

