runtime:
  scripts:
    - type: after-response
      code: "// Aktuelles Datum und Uhrzeit als Zeitstempel in Millisekunden\r

        let currentTimeStamp = new Date().getTime();\r

        \r

        // Erzeugen der aktuellen Zeit plus 2 Stunden als Zeitstempel in Millisekunden\r

        let twoHoursLaterTimeStamp = currentTimeStamp + 2 * 60 * 60 * 1000;\r

        \r

        // Überprüfe, ob TimetabledTime in der Response mehr als 2 Stunden nach der aktuellen Zeit ist\r

        test('Überprüfe TimetabledTime ist mehr als 2 Stunden nach der aktuellen Zeit', function() {\r

        \    let responseXml = res.getBody()?.toString(); // Annahme: Die Antwort ist als XML-Text verfügbar\r

        \    let regex = new RegExp(`<ojp:TimetabledTime>(.*?)<\\/ojp:TimetabledTime>`);\r

        \    let match = responseXml.match(regex);\r

        \r

        \    if (match) {\r

        \        let timetabledTimeString = match[1];\r

        \        let timetabledTime = new Date(timetabledTimeString).getTime(); // Zeitstempel der TimetabledTime\r

        \r

        \        expect(timetabledTime).to.be.above(twoHoursLaterTimeStamp);\r

        \    } else {\r

        \        expect.fail('TimetabledTime wurde nicht gefunden.');\r

        \    }\r

        });"

