info:
  name: TR-6b_Direkte Verbindungen
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}"
  headers:
    - name: Content-Type
      value: text/xml
  body:
    type: xml
    data: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <OJP xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns=\"http://www.siri.org.uk/siri\" version=\"1.0\" xmlns:ojp=\"http://www.vdv.de/ojp\" xsi:schemaLocation=\"http://www.siri.org.uk/siri ../ojp-xsd-v1.0/OJP.xsd\">\r

      \    <OJPRequest>\r

      \        <ServiceRequest>\r

      \            <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \            <RequestorRef>SKIPlusRegTest</RequestorRef>\r

      \            <ojp:OJPTripRequest>\r

      \                <RequestTimestamp>{{isoTimestamp}}</RequestTimestamp>\r

      \                <MessageIdentifier>TR-6b</MessageIdentifier>\r

      \                <Origin>\r

      \                    <PlaceRef>\r

      \                        <StopPlaceRef>ch:1:sloid:7100</StopPlaceRef>\r

      \                        <LocationName>\r

      \                            <Text>Thun (Thun)</Text>\r

      \                        </LocationName>\r

      \                    </PlaceRef>\r

      \                    <DepArrTime>{{friday_timetable_change}}T11:00:00Z</DepArrTime>\r

      \                </Origin>\r

      \                <Destination>\r

      \                    <PlaceRef>\r

      \                        <StopPlaceRef>ch:1:sloid:7493</StopPlaceRef>\r

      \                        <LocationName>\r

      \                            <Text>Interlaken West (Interlaken)</Text>\r

      \                        </LocationName>\r

      \                    </PlaceRef>\r

      \                </Destination>\r

      \                <ojp:Params>\r

      \                    <ojp:NumberOfResults>1</ojp:NumberOfResults>\r

      \                    <ojp:IncludeTrackSections>false</ojp:IncludeTrackSections>\r

      \                    <ojp:IncludeLegProjection>false</ojp:IncludeLegProjection>\r

      \                    <ojp:IncludeTurnDescription>false</ojp:IncludeTurnDescription>\r

      \                    <ojp:IncludeIntermediateStops>true</ojp:IncludeIntermediateStops>\r

      \                </ojp:Params>\r

      \            </ojp:OJPTripRequest>\r

      \        </ServiceRequest>\r

      \    </OJPRequest>\r

      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Enthält Bus von Operator STI Bus\", function () {\r

        \    expect(res.getBody()?.toString()).to.include(\"STI Bus\");\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
