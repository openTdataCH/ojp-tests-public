      </OJP>"
  auth:
    type: bearer
    token: "{{BearerToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Fussweg = 28min aufgrund Höhendaten, ohne Höhendaten wären es 24min", function () {
            expect(res.getBody()?.toString()).to.include("<ojp:Duration>PT28M");

        });

